<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>四级词汇课件</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">
<!-- 组件库 Web Awesome：只引主题变量和组件加载器（用到哪个组件自动加载哪个），不引 native.css，免得改动课文页 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/themes/default.css">
<script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="icon" id="menuBtn" aria-label="目录">☰</button>
  <a class="icon" id="homeBtn" href="#/" aria-label="首页" title="首页">⌂</a>
  <div class="crumb" id="crumb">加载中…</div>
  <div class="search">
    <input id="q" type="search" placeholder="搜单词" autocomplete="off" spellcheck="false">
    <div id="qres" class="qres"></div>
  </div>
  <a class="icon" id="setBtn" href="#/settings" aria-label="设置" title="设置">⚙</a>
</header>

<nav id="drawer" class="drawer" aria-label="目录"></nav>
<div id="scrim" class="scrim"></div>

<main class="wrap" id="lessonView">
  <section id="lessonHead" class="lesson-head"></section>
  <div id="groups"></div>
  <p class="foot">内容取自《英语四级 · 你还在背单词吗》，仅供个人学习。例句逐词释义为 AI 补充，标注「补充」。</p>
</main>

<main class="wrap settings" id="settingsView" hidden></main>

<main class="wrap study" id="studyView" hidden></main>

<div class="fabs" id="fabs">
  <button class="fab" id="maskFab" title="背诵模式：遮住中文">遮</button>
  <button class="fab main" id="playAll" title="磨耳朵">🎧</button>
</div>

<div id="pop" class="pop"></div>
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar"><span id="viewerTitle"></span><button class="icon" id="viewerClose" aria-label="关闭">✕</button></div>
  <div id="viewerBody" class="viewer-body"></div>
</div>

<div id="toast" class="toast" role="status"></div>

<script src="sync.js"></script>
<script src="srs.js"></script>
<script src="app.js"></script>
<script src="study.js"></script>
</body>
</html>
