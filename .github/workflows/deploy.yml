# 推送到 main 后：校验数据 → 生成音频（有缓存，只补新的）→ 部署到 GitHub Pages
# 原书扫描页（site/data/pages/）不进仓库，也不部署。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install edge-tts

      - name: 校验数据
        run: python pipeline/validate.py

      # 音频文件按内容哈希命名。每次运行都存一份最新缓存（键带 run_id），
      # 这样上次失败跳过的文件补上后也能存进去
      - uses: actions/cache@v4
        with:
          path: site/data/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-

      - name: 生成音频
        env:
          AUDIO_CONCURRENCY: "3"   # GitHub 服务器 IP 并发高了会被语音服务限流
        run: |
          for f in site/data/lessons/*.json; do
            python pipeline/build_audio.py "$(basename "$f" .json)"
          done

      - name: 生成目录索引
        run: python pipeline/build_index.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
