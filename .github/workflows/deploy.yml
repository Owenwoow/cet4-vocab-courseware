# 推送到 main 后：校验数据 → 检查音频已上线 → 目录索引 → 部署到 GitHub Pages
# 音频由 audio 工作流生成并发布到 cet4-vocab-audio，这里仅校验。
# 原书扫描页（site/data/pages/）不进仓库，也不部署。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 校验数据
        run: python pipeline/validate.py

      - name: 单元测试（复习规则）
        run: node --test "tests/*.test.js"

      - name: 检查音频已推送到音频站
        env:
          GH_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}
          AUDIO_REPO: Owenwoow/cet4-vocab-audio
        run: |
          published=$(gh run list -R "$AUDIO_REPO" -w pages-build-deployment --branch main --status success -L 1 --json headSha --jq '.[0].headSha')
          test -n "$published"
          files=$(gh api "repos/$AUDIO_REPO/git/trees/$published" --jq '.tree[] | select(.path == "files" and .type == "tree") | .sha')
          test -n "$files"
          gh api "repos/$AUDIO_REPO/git/trees/$files" > "$RUNNER_TEMP/audio-tree.json"
          python pipeline/check_audio.py --published-tree "$RUNNER_TEMP/audio-tree.json"

      - name: 生成目录索引
        run: python pipeline/build_index.py

      # Pages 让浏览器缓存 10 分钟；给脚本和样式加版本号，部署后立即生效
      - name: 静态资源加版本号
        run: sed -i -E "s/(app|sync|srs|recall|study|vocab|sent|video|backup)\.js\"/\1.js?v=${GITHUB_SHA::7}\"/g; s/style\.css[^\"]*\"/style.css?v=${GITHUB_SHA::7}\"/" site/index.html && grep -E "\.js|style.css" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
