# 推送到 main 后：校验数据 → 生成音频（有缓存，只补新的）→ 部署到 GitHub Pages
# 原书扫描页（site/data/pages/）不进仓库，也不部署。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install edge-tts

      - name: 校验数据
        run: python pipeline/validate.py

      # 音频文件按内容哈希命名，缓存起来，每次只补新增的
      - uses: actions/cache@v4
        with:
          path: site/data/audio
          key: audio-${{ hashFiles('site/data/lessons/*.json', 'pipeline/build_audio.py') }}
          restore-keys: audio-

      - name: 生成音频
        run: |
          for f in site/data/lessons/*.json; do
            python pipeline/build_audio.py "$(basename "$f" .json)"
          done

      - name: 生成目录索引
        run: python pipeline/build_index.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
