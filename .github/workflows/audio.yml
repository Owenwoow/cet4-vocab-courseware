name: audio
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 验证音频仓库访问
        required: true
        type: string
jobs:
  verify-access:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUDIO_REPO_TOKEN }}
    steps:
      - name: 核对令牌身份与音频站工作流访问
        run: |
          test "$(gh api user --jq .login)" = "Owenwoow"
          gh api 'repos/Owenwoow/cet4-vocab-audio/actions/workflows/pages-build-deployment/runs?per_page=1' --jq '.workflow_runs[0].conclusion'
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUDIO_REPO_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Owenwoow/cet4-vocab-audio
          path: audio-store
          token: ${{ secrets.AUDIO_REPO_TOKEN }}
      - name: 检查两个仓库的 Git 推送权限
        run: |
          git push --dry-run origin HEAD:refs/heads/codex/audio-permission-probe
          git -C audio-store push --dry-run origin HEAD:refs/heads/codex/audio-permission-probe
