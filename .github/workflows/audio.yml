# 手动触发：在云端生成指定课的音频，推到音频仓库 cet4-vocab-audio，再把音频清单提交回主仓库。
# 提交回主仓库会触发 deploy 工作流（校验 → 检查音频已上线 → 部署），所以这里不用再手动部署。
#
# 用法：GitHub → Actions → audio → Run workflow，lessons 填 "u08-l03 u08-l04"（空格分隔）。
# 选 main 会发布到音频仓库，并提交清单。选其他分支默认打包预览音频，
# 勾选 publish_audio 则先发布到音频仓库，只打包清单，供课件之后一起上线。
#
# 需要一个 Secret：AUDIO_REPO_TOKEN（fine-grained PAT），仅授权本账号的这两个仓库：
#   cet4-vocab-audio      Contents: 读写、Actions: 只读（查询 Pages 工作流结果）
#   cet4-vocab-courseware Contents: 读写
# 用 PAT 而不是默认的 GITHUB_TOKEN：默认令牌不能推别的仓库，
# 而且用它提交的内容不会触发 deploy。
#
# 限流：GitHub 服务器 IP 容易被微软语音服务限流，所以并发固定为 3，且所有课在同一个任务里顺序做。
# 发布模式分批保存音频，失败课记入汇总，其余课继续。最后统一等待 Pages。
name: audio

on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 课程 id，空格分隔，例如 u08-l03 u08-l04
        required: true
        type: string
      publish_audio:
        description: 在试点分支发布音频到音频仓库，只下载清单
        type: boolean
        default: false

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AUDIO_CONCURRENCY: "3"
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ (github.ref == 'refs/heads/main' || inputs.publish_audio) && secrets.AUDIO_REPO_TOKEN || github.token }}
      LESSONS: ${{ inputs.lessons }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.ref == 'refs/heads/main' && secrets.AUDIO_REPO_TOKEN || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: Owenwoow/cet4-vocab-audio
          path: audio-store
          token: ${{ (github.ref == 'refs/heads/main' || inputs.publish_audio) && secrets.AUDIO_REPO_TOKEN || github.token }}
          persist-credentials: ${{ github.ref == 'refs/heads/main' || inputs.publish_audio }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install edge-tts

      - name: 检查课程 id
        run: |
          for id in $LESSONS; do
            [[ "$id" =~ ^u[0-9]{2}-l[0-9]{2}$ ]] || { echo "课程 id 格式不对：$id"; exit 1; }
            [ -f "site/data/lessons/$id.json" ] || { echo "当前分支找不到 site/data/lessons/$id.json"; exit 1; }
          done

      - name: 设置提交身份
        if: github.ref == 'refs/heads/main' || inputs.publish_audio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 逐课生成音频
        run: |
          # 同一次重试直接复用已生成的文件，避免单个音色临时失败丢掉整课。
          count=0
          failed=()
          set -- $LESSONS
          if [ "$#" -eq 0 ]; then echo "请指定至少一课"; exit 1; fi
          for id in $LESSONS; do
            echo "::group::$id"
            if ! python pipeline/build_audio.py "$id"; then
              sleep 15
              if ! python pipeline/build_audio.py "$id"; then
                failed+=("$id")
                echo "::warning::音频生成未完成：$id"
              fi
            fi
            count=$((count + 1))
            if { [ "$GITHUB_REF" = "refs/heads/main" ] || [ "${{ inputs.publish_audio }}" = "true" ]; } && [ "$#" -gt 1 ] && [ "$((count % 4))" -eq 0 ]; then
              AUDIO_SKIP_WAIT=1 python pipeline/publish_audio.py
            fi
            shift
            echo "::endgroup::"
          done
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "${{ inputs.publish_audio }}" = "true" ]; then
            python pipeline/publish_audio.py
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::待补跑课程：${failed[*]}"
            exit 1
          fi

      - name: 收集本次生成的清单
        if: github.ref != 'refs/heads/main' && inputs.publish_audio
        run: |
          mkdir -p audio-manifests
          for id in $LESSONS; do cp "site/data/audio/$id.json" audio-manifests/; done

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && inputs.publish_audio
        with:
          name: audio-manifests
          path: audio-manifests/
          if-no-files-found: error

      - name: 把音频清单提交回主仓库（触发 deploy）
        if: github.ref == 'refs/heads/main'
        run: |
          git add site/data/audio
          if git diff --cached --quiet; then
            echo "清单没有变化，不提交"
          else
            git commit -m "chore(audio): 云端生成音频清单 ${LESSONS}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 打包本地预览所需清单与音频
        if: github.ref != 'refs/heads/main' && !inputs.publish_audio
        run: |
          python - $LESSONS <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          preview = Path("audio-preview")
          manifests = Path("site/data/audio")
          files = Path("audio-store/files")
          (preview / manifests).mkdir(parents=True, exist_ok=True)
          (preview / files).mkdir(parents=True, exist_ok=True)
          keys = set()
          for lid in sys.argv[1:]:
              path = manifests / f"{lid}.json"
              shutil.copyfile(path, preview / path)
              manifest = json.loads(path.read_text(encoding="utf-8"))
              keys.update(manifest["z"].values())
              for field in ("w", "p"):
                  keys.update(key for voices in manifest[field].values() for key in voices.values())
              keys.update(sentence["f"] for voices in manifest["s"].values() for sentence in voices.values())
          for key in sorted(keys):
              source = files / f"{key}.mp3"
              shutil.copyfile(source, preview / source)
              marks = files / f"{key}.json"
              if marks.exists():
                  shutil.copyfile(marks, preview / marks)
          PY

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' && !inputs.publish_audio
        with:
          name: audio-preview
          path: audio-preview/
          if-no-files-found: error
